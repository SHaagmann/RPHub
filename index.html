<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1019" />
  <meta name="description" content="RP Desk – deine lokale Toolbox für Rollenspiel, Charaktere, Ermittlungen und Alltag." />
  <title>RP Desk · Deine lokale RP-Toolbox</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css?v=2" />
  <script src="app.js?v=2" defer></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">R<span>.</span></div><div><strong>RP DESK</strong><small>YOUR ROLEPLAY WORKSPACE</small></div></div>
      <div class="sidebar-label">WORKSPACE</div>
      <nav id="navigation" aria-label="Hauptnavigation"></nav>
      <div class="sidebar-bottom"><span class="status-dot"></span> Lokal gespeichert <span class="sidebar-version">v1.0</span></div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left"><button class="icon-button mobile-menu" id="mobile-menu" aria-label="Menü öffnen">☰</button><div class="breadcrumb"><span>RP DESK</span><span class="crumb-slash">/</span><strong id="current-page-name">Übersicht</strong></div></div>
        <div class="topbar-actions"><span class="local-indicator">● <span>PRIVATE WORKSPACE</span></span><label class="topbar-select-label" for="character-select">CHARAKTER</label><select id="character-select" aria-label="Aktiver Charakter"></select><button class="button button-quiet" data-action="export" title="Alle Daten als JSON sichern"><span class="btn-icon">↓</span><span class="hide-small">Backup</span></button></div>
      </header>
      <main class="content" id="content"></main>
      <footer class="footer">RP DESK · Alle Daten bleiben in deinem Browser. Kein Server, kein Tracking.</footer>
    </div>
  </div>
  <input type="file" id="backup-import" accept=".json,application/json" hidden />
  <div class="toast-container" id="toasts" aria-live="polite"></div>
</body>
</html>
